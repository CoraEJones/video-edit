name: Video edit regression

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install base dependencies and FFmpeg
        shell: pwsh
        run: |
          python -m pip install -r requirements-base.txt
          choco install ffmpeg --no-progress -y
      - name: Real-media and pure-data regression
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $env:VIDEO_EDIT_FFMPEG = (Get-Command ffmpeg.exe).Source
          $env:VIDEO_EDIT_FFPROBE = (Get-Command ffprobe.exe).Source
          $env:VIDEO_EDIT_QA_ROOT = Join-Path $env:RUNNER_TEMP 'video-edit-qa'
          New-Item -ItemType Directory -Path $env:VIDEO_EDIT_QA_ROOT -Force | Out-Null
          python -m unittest discover -s tests -v
